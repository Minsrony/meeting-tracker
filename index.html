<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Meeting Action Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D2530F'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column. Summary card, add-action card, then one card per owner holding their actions. */
:root {
  --bg: #F2F0ED;
  --card: #FBFAF8;
  --line: #E3DFD9;
  --track: #E6E2DC;
  --fg: #2B2926;
  --muted: #6F6960;
  --accent: #D2530F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE6D8;
  --accent-text: #A8430A;
  --red: #B3261E;
  --red-ink: #FFFFFF;
  --red-soft: #FBE9E7;
  --red-line: #F0C9C4;
  --font-display: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1917; --card: #242220; --line: #383530; --track: #35322E;
    --fg: #EFECE7; --muted: #A59F95;
    --accent: #F28A3F; --accent-ink: #1A1917; --accent-soft: #3A2A1E; --accent-text: #F5A06A;
    --red: #FF8A7A; --red-ink: #2B0F0C; --red-soft: #3B2220; --red-line: #5A302C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1917; --card: #242220; --line: #383530; --track: #35322E;
  --fg: #EFECE7; --muted: #A59F95;
  --accent: #F28A3F; --accent-ink: #1A1917; --accent-soft: #3A2A1E; --accent-text: #F5A06A;
  --red: #FF8A7A; --red-ink: #2B0F0C; --red-soft: #3B2220; --red-line: #5A302C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  padding-block: 40px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
#app { display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
button { font-family: inherit; }

.top { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.today { font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.25rem, 6vw, 3.25rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }

/* Summary */
.summary { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 4px 24px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; padding-left: 0; }
.num {
  display: block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.5rem, 9vw, 3.75rem);
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.lbl { display: block; margin-top: 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat.hot .num, .stat.hot .lbl { color: var(--red); }
.progress { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
.progress-note { font-size: 16px; color: var(--muted); }

/* Add form */
.add { padding: 24px; }
.add h2 { margin-bottom: 18px; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 16px; align-items: end; }
.f-what { grid-column: 1 / -1; }
.field { min-width: 0; }
.field label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
input[type="text"], input[type="date"], input[type="email"], input[type="password"] {
  width: 100%; min-width: 0; height: 54px; padding: 0 16px;
  font: inherit; font-size: 18px; color: var(--fg);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px;
}
input::placeholder { color: var(--muted); opacity: 0.85; }
input[type="text"]:focus-visible, input[type="date"]:focus-visible, input[type="email"]:focus-visible, input[type="password"]:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
}
.btn {
  height: 54px; padding: 0 28px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 600;
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn:focus-visible, .chip:focus-visible, .btn-ghost:focus-visible, .del:focus-visible, .undo:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn-ghost {
  height: 44px; padding: 0 18px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer;
  background: transparent; color: var(--fg); font-size: 16px; font-weight: 600; white-space: nowrap;
}
.btn-ghost:hover { background: var(--track); }
.btn-ghost.sm { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 10px; }

/* Example banner */
.sample {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px;
  padding: 16px 20px; border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: 16px;
}
.sample p { min-width: 0; flex: 1 1 260px; }

/* Toolbar and filters */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg); font-size: 16px; font-weight: 600;
}
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.chip:hover { background: var(--track); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip[aria-pressed="true"] span { color: var(--bg); opacity: 0.75; }

/* Owner cards */
#groups { display: flex; flex-direction: column; gap: 20px; }
.owner { overflow: hidden; }
.owner-head { display: flex; align-items: center; gap: 14px; padding: 20px 24px; }
.avatar {
  flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--track); color: var(--fg); font-family: var(--font-display); font-weight: 600; font-size: 20px;
}
.owner-name { min-width: 0; }
.owner-name h3 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.owner-name p { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.owner-head .pill { margin-left: auto; flex: none; }

.items { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 16px;
  padding: 18px 24px; border-top: 1px solid var(--line);
}
.item.is-over { background: var(--red-soft); border-top-color: var(--red-line); }
.item.fresh { animation: fresh 1.8s ease-out; }
@keyframes fresh { from { background: var(--accent-soft); } to { background: transparent; } }

.cb {
  appearance: none; -webkit-appearance: none; margin: 2px 0 0; flex: none;
  width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--muted); background: var(--card);
  display: grid; place-content: center; cursor: pointer; transition: background 0.12s, border-color 0.12s;
}
.cb::after {
  content: ""; width: 15px; height: 8px; margin-top: -3px;
  border-left: 3px solid var(--accent-ink); border-bottom: 3px solid var(--accent-ink);
  transform: rotate(-45deg) scale(0); transition: transform 0.12s;
}
.cb:checked { background: var(--accent); border-color: var(--accent); }
.cb:checked::after { transform: rotate(-45deg) scale(1); }
.cb:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.item.is-over .cb:not(:checked) { border-color: var(--red); }

.body { min-width: 0; }
.what-text { display: block; font-size: 19px; line-height: 1.4; font-weight: 500; cursor: pointer; overflow-wrap: anywhere; }
.item.is-done .what-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.due { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 16px; color: var(--muted); }
.item.is-over .due { color: var(--red); font-weight: 500; }
.pill { display: inline-block; padding: 2px 11px; border-radius: 999px; font-size: 14px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
.pill-red { background: var(--red); color: var(--red-ink); }
.pill-accent { background: var(--accent-soft); color: var(--accent-text); }
.del {
  width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.del:hover { background: var(--track); color: var(--red); }
.del svg { width: 20px; height: 20px; }

.empty { padding: 28px 24px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.empty .btn-ghost { margin-top: 12px; }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: var(--muted); margin-top: 4px; }
.foot span { min-width: 0; }

/* Toast */
.toast {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.toast-inner {
  pointer-events: auto; display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 20px;
  background: var(--fg); color: var(--bg); border-radius: 14px; font-size: 16px; font-weight: 500;
}
.toast-inner:has(#undo[hidden]) { padding-right: 20px; }
.undo { height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; cursor: pointer; }

@media (max-width: 560px) {
  body { padding-top: 28px; font-size: 17px; }
  .summary, .add { padding: 18px; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .add .btn { width: 100%; }
  .stat { padding: 4px 12px; }
  .owner-head { padding: 16px 18px; flex-wrap: wrap; }
  .owner-head .pill { margin-left: 0; }
  .item { padding: 16px 14px 16px 18px; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="today" id="today"></p>
    <h1>Meeting Action Tracker</h1>
  </header>

  <!-- Shown only if the Supabase library fails to load -->
  <section class="card empty" id="boot" role="status" hidden>
    <strong id="boot-title">Could not load the page</strong>
    <span id="boot-text"></span>
  </section>

  <div id="app">
    <section class="card summary" aria-label="Summary">
      <div class="stats">
        <div class="stat"><span class="num" id="n-open">&ndash;</span><span class="lbl">Open</span></div>
        <div class="stat"><span class="num" id="n-done">&ndash;</span><span class="lbl">Done</span></div>
        <div class="stat" id="stat-over"><span class="num" id="n-over">&ndash;</span><span class="lbl">Overdue</span></div>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-label="Share of actions done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
      <p class="progress-note" id="progress-note">Loading actions&hellip;</p>
    </section>

    <form class="card add" id="add-form" autocomplete="off">
      <h2>Add an action</h2>
      <div class="fields">
        <div class="field f-what">
          <label for="what">What was agreed?</label>
          <input type="text" id="what" maxlength="200" required placeholder="e.g. Send the revised timeline to the client">
        </div>
        <div class="field">
          <label for="owner">Owner</label>
          <input type="text" id="owner" list="owners" maxlength="40" required placeholder="Who will do it?">
        </div>
        <div class="field">
          <label for="due">Due date</label>
          <input type="date" id="due" required>
        </div>
        <button class="btn" id="add-btn" type="submit" disabled>Add action</button>
      </div>
    </form>
    <datalist id="owners"></datalist>

    <div class="sample" id="sample" hidden>
      <p>These are example actions so you can see how the tracker works.</p>
      <button type="button" class="btn-ghost" id="clear-samples">Clear examples</button>
    </div>

    <div class="toolbar">
      <h2>By owner</h2>
      <div class="chips" id="chips" role="group" aria-label="Show actions">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">All <span id="c-all">0</span></button>
        <button type="button" class="chip" data-filter="open" aria-pressed="false">Open <span id="c-open">0</span></button>
        <button type="button" class="chip" data-filter="overdue" aria-pressed="false">Overdue <span id="c-over">0</span></button>
      </div>
    </div>

    <main id="groups"></main>
    <div class="foot">
      <span id="foot-text">Connecting to Supabase&hellip;</span>
      <button type="button" class="btn-ghost sm" id="refresh">Refresh</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <div class="toast-inner" role="status">
    <span id="toast-msg"></span>
    <button type="button" class="undo" id="undo">Undo</button>
  </div>
</div>

<!-- Pinned supabase-js build (UMD defines window.supabase) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  /* Project settings. This version is open: anyone who has the link can read and change every action.
     The publishable key is public by design. Each table in the project has its own rules, and meeting_actions is open. */
  var SUPABASE_URL = 'https://jeerscukwmcawmoddoax.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_JkOIq3bGF5fHrFLVFwfRNg_p19u-bcW';

  var FILTER_KEY = 'meeting-action-tracker.filter';
  var POLL_MS = 60000;
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } })
    : null;

  var view = 'app';                // app | error
  var channel = null;
  var rtTimer = null;
  var actions = [];
  var loaded = false;
  var status = null;
  var staleNote = false;
  var pending = 0;
  var refreshing = false;
  var retried = false;
  var syncedAt = null;
  var filter = 'all';
  var lastDeleted = null;
  var freshId = null;
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }
  var els = {
    today: $('today'), open: $('n-open'), done: $('n-done'), over: $('n-over'), statOver: $('stat-over'),
    bar: $('bar'), progress: $('progress'), note: $('progress-note'),
    groups: $('groups'), owners: $('owners'), sample: $('sample'), foot: $('foot-text'),
    toast: $('toast'), toastMsg: $('toast-msg'), undo: $('undo'),
    form: $('add-form'), what: $('what'), owner: $('owner'), due: $('due'), addBtn: $('add-btn'),
    cAll: $('c-all'), cOpen: $('c-open'), cOver: $('c-over')
  };

  /* ---------- dates ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function todayISO() { return iso(new Date()); }
  function diffDays(s) { return Math.round((parse(s) - parse(todayISO())) / 86400000); }
  function fmt(s) {
    var d = parse(s);
    var o = { weekday: 'short', day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    return d.toLocaleDateString(undefined, o);
  }
  function clock(d) { return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }

  /* ---------- page state ---------- */
  function showBoot(title, text) {
    view = 'error';
    $('boot-title').textContent = title; $('boot-text').textContent = text;
    $('boot').hidden = false; $('app').hidden = true;
  }

  /* ---------- data ---------- */
  function mapRow(r) {
    return { id: String(r.id), text: String(r.action), owner: String(r.owner), due: String(r.due_date).slice(0, 10),
      done: !!r.done, sample: !!r.is_example, created: Date.parse(r.created_at) || 0 };
  }
  function valid(a) { return UUID_RE.test(a.id) && a.text && a.owner && DATE_RE.test(a.due); }
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  function onError(err, isRead) {
    if (isRead && !retried) { retried = true; setTimeout(function () { refresh(false); }, 2000 + Math.random() * 1000); }
    if (loaded) staleNote = true;
    else {
      var net = /failed to fetch|network/i.test((err && err.message) || '');
      status = net
        ? { title: 'Cannot reach Supabase', text: 'Check your connection, then try again.', retry: 'Try again' }
        : { title: 'Supabase returned an error', text: String((err && err.message) || 'The request failed.').slice(0, 220), retry: 'Try again' };
    }
    render();
  }

  function refresh(manual) {
    if (refreshing || view !== 'app' || !sb) return;
    refreshing = true;
    Promise.resolve(
      sb.from('meeting_actions').select('id, action, owner, due_date, done, is_example, created_at').order('created_at', { ascending: true })
    ).then(function (res) {
      if (res.error) throw res.error;
      retried = false; staleNote = false; status = null;
      if (pending > 0) return;           // a newer local change is in flight; its refresh follows
      actions = res.data.map(mapRow).filter(valid);
      loaded = true; syncedAt = new Date();
      render();
    }).catch(function (err) {
      onError(err, true);
    }).then(function () { refreshing = false; });
  }

  function write(request) {
    pending++;
    return Promise.resolve(request).then(function (res) {
      if (res.error) throw res.error;
      return true;
    }).catch(function (err) {
      showToast('Could not save that change. Showing what is in Supabase.', false);
      return false;
    }).then(function (ok) {
      pending--;
      if (pending === 0) refresh(false);
      return ok;
    });
  }

  function start() {
    loaded = false; status = null; staleNote = false;
    render();
    refresh(false);
    unsubscribe();
    channel = sb.channel('meeting-actions')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'meeting_actions' }, function () {
        clearTimeout(rtTimer);
        rtTimer = setTimeout(function () { if (pending === 0) refresh(false); }, 300);
      })
      .subscribe();
  }
  function unsubscribe() { if (channel && sb) { sb.removeChannel(channel); } channel = null; }
  /* ---------- tiny DOM helper ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    var attrs = ['for', 'type', 'id', 'role', 'title'];
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('data-') === 0 || k.indexOf('aria-') === 0 || attrs.indexOf(k) > -1) el.setAttribute(k, v === true ? '' : v);
        else el[k] = v;
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return el;
  }
  function binIcon() {
    var s = h('span');
    s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
    return s.firstChild;
  }

  /* ---------- rendering ---------- */
  function dueInfo(a, n) {
    if (a.done) return { text: 'Due ' + fmt(a.due) };
    if (n < 0) return { pill: (-n) + (n === -1 ? ' day overdue' : ' days overdue'), pillCls: 'pill-red', text: 'Due ' + fmt(a.due) };
    if (n === 0) return { pill: 'Due today', pillCls: 'pill-accent' };
    if (n === 1) return { text: 'Due tomorrow, ' + fmt(a.due) };
    return { text: 'Due ' + fmt(a.due) };
  }
  function isOver(a) { return !a.done && diffDays(a.due) < 0; }

  function itemEl(a, fresh) {
    var n = diffDays(a.due);
    var over = !a.done && n < 0;
    var info = dueInfo(a, n);
    return h('li', { class: 'item' + (a.done ? ' is-done' : '') + (over ? ' is-over' : '') + (fresh ? ' fresh' : ''), 'data-id': a.id },
      h('input', { type: 'checkbox', class: 'cb', id: 'cb-' + a.id, checked: a.done, 'data-id': a.id }),
      h('div', { class: 'body' },
        h('label', { class: 'what-text', 'for': 'cb-' + a.id, text: a.text }),
        h('p', { class: 'due' },
          info.pill ? h('span', { class: 'pill ' + info.pillCls, text: info.pill }) : null,
          info.text ? h('span', { text: info.text }) : null)),
      h('button', { type: 'button', class: 'del', 'data-del': a.id, 'aria-label': 'Delete action: ' + a.text, title: 'Delete' }, binIcon()));
  }
  function emptyEl(title, text, retryLabel) {
    return h('div', { class: 'card empty', role: 'status' }, h('strong', { text: title }), text,
      retryLabel ? h('button', { type: 'button', class: 'btn-ghost', 'data-retry': '1', text: retryLabel }) : null);
  }

  function render() {
    var fresh = freshId; freshId = null;
    els.today.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    els.addBtn.disabled = !loaded;

    var total = actions.length;
    var done = actions.filter(function (a) { return a.done; }).length;
    var open = total - done;
    var over = actions.filter(isOver).length;
    var dash = '–';

    els.open.textContent = loaded ? open : dash;
    els.done.textContent = loaded ? done : dash;
    els.over.textContent = loaded ? over : dash;
    els.statOver.classList.toggle('hot', loaded && over > 0);
    var pct = total ? Math.round(done / total * 100) : 0;
    els.bar.style.width = pct + '%';
    els.progress.setAttribute('aria-valuenow', pct);
    els.note.textContent = !loaded ? (status ? 'Not connected to Supabase' : 'Loading actions…')
      : total ? done + ' of ' + total + (total === 1 ? ' action' : ' actions') + ' done' : 'Nothing tracked yet';
    els.cAll.textContent = total; els.cOpen.textContent = open; els.cOver.textContent = over;
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', c.getAttribute('data-filter') === filter ? 'true' : 'false');
    });
    els.sample.hidden = !(loaded && actions.some(function (a) { return a.sample; }));

    if (!loaded) {
      els.groups.replaceChildren(status
        ? emptyEl(status.title, status.text, status.retry)
        : emptyEl('Loading actions', 'Fetching the latest list from Supabase.'));
      updateFoot();
      return;
    }

    // group by owner (case-insensitive), alphabetical
    var map = new Map();
    actions.forEach(function (a) {
      var k = a.owner.toLowerCase();
      if (!map.has(k)) map.set(k, { name: a.owner, items: [] });
      map.get(k).items.push(a);
    });
    var groups = Array.from(map.values()).sort(function (x, y) { return x.name.localeCompare(y.name); });
    els.owners.replaceChildren.apply(els.owners, groups.map(function (g) { return h('option', { value: g.name }); }));

    function pass(a) { return filter === 'all' || (filter === 'open' && !a.done) || (filter === 'overdue' && isOver(a)); }
    var cards = [];
    groups.forEach(function (g) {
      var shown = g.items.filter(pass).sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return a.due < b.due ? -1 : a.due > b.due ? 1 : a.created - b.created;
      });
      if (!shown.length) return;
      var gOpen = g.items.filter(function (a) { return !a.done; }).length;
      var gDone = g.items.length - gOpen;
      var gOver = g.items.filter(isOver).length;
      cards.push(h('section', { class: 'card owner', 'aria-label': 'Actions for ' + g.name },
        h('header', { class: 'owner-head' },
          h('span', { class: 'avatar', 'aria-hidden': 'true', text: g.name.charAt(0).toUpperCase() }),
          h('div', { class: 'owner-name' }, h('h3', { text: g.name }), h('p', { text: gOpen + ' open · ' + gDone + ' done' })),
          gOver ? h('span', { class: 'pill pill-red', text: gOver + ' overdue' }) : null),
        h('ul', { class: 'items' }, shown.map(function (a) { return itemEl(a, a.id === fresh); }))));
    });
    if (!cards.length) {
      if (!total) cards.push(emptyEl('No actions yet', 'Add the first one above before the meeting ends.'));
      else if (filter === 'overdue') cards.push(emptyEl('Nothing is overdue', 'Every open action is still within its due date.'));
      else cards.push(emptyEl('No open actions', 'Everything agreed so far is done.'));
    }
    els.groups.replaceChildren.apply(els.groups, cards);
    updateFoot();

    if (fresh) {
      var el = els.groups.querySelector('.item[data-id="' + fresh + '"]');
      if (el) el.scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
  }
  function updateFoot() {
    if (!loaded) { els.foot.textContent = status ? 'Not connected.' : 'Connecting to Supabase…'; return; }
    els.foot.textContent = staleNote
      ? 'Could not sync. Showing the data from ' + clock(syncedAt) + '.'
      : 'Live from Supabase, synced ' + clock(syncedAt) + '.';
  }

  /* ---------- actions ---------- */
  function add(text, owner, due) {
    var existing = actions.find(function (a) { return a.owner.toLowerCase() === owner.toLowerCase(); });
    var a = { id: newId(), text: text, owner: existing ? existing.owner : owner, due: due, done: false, sample: false, created: Date.now() };
    actions.push(a);
    filter = 'all'; saveFilter();
    freshId = a.id;
    render();
    write(sb.from('meeting_actions').insert({ id: a.id, action: a.text, owner: a.owner, due_date: a.due }));
  }
  function toggle(id) {
    var a = actions.find(function (x) { return x.id === id; });
    if (!a) return;
    a.done = !a.done;
    render();
    var cb = document.getElementById('cb-' + id);
    if (cb) cb.focus({ preventScroll: true });
    write(sb.from('meeting_actions').update({ done: a.done }).eq('id', id));
  }
  function remove(id) {
    var i = actions.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    lastDeleted = { item: actions[i], index: i };
    actions.splice(i, 1);
    render();
    showToast('Action deleted', true);
    write(sb.from('meeting_actions').delete().eq('id', id));
  }
  function undoDelete() {
    if (!lastDeleted) return;
    var a = lastDeleted.item;
    actions.splice(Math.min(lastDeleted.index, actions.length), 0, a);
    freshId = a.id;
    lastDeleted = null;
    hideToast(); render();
    write(sb.from('meeting_actions').insert({
      id: a.id, action: a.text, owner: a.owner, due_date: a.due, done: a.done, is_example: a.sample,
      created_at: new Date(a.created || Date.now()).toISOString()
    }));
  }
  function clearExamples() {
    actions = actions.filter(function (a) { return !a.sample; });
    render();
    write(sb.from('meeting_actions').delete().eq('is_example', true));
  }

  function showToast(msg, withUndo) {
    els.toastMsg.textContent = msg;
    els.undo.hidden = !withUndo;
    els.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, withUndo ? 6000 : 7000);
  }
  function hideToast() { els.toast.hidden = true; }
  function saveFilter() { try { localStorage.setItem(FILTER_KEY, filter); } catch (e) {} }

  /* ---------- events ---------- */
  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!loaded) return;
    var text = els.what.value.trim();
    var owner = els.owner.value.trim();
    var due = els.due.value;
    if (!text || !owner || !DATE_RE.test(due)) return;
    add(text, owner, due);
    els.what.value = '';
    els.owner.value = '';
    els.what.focus({ preventScroll: true });
  });
  els.groups.addEventListener('change', function (e) {
    if (e.target.matches('input.cb')) toggle(e.target.getAttribute('data-id'));
  });
  els.groups.addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]');
    if (b) { remove(b.getAttribute('data-del')); return; }
    if (e.target.closest('[data-retry]')) { retried = false; refresh(true); }
  });
  $('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    filter = c.getAttribute('data-filter'); saveFilter(); render();
  });
  $('clear-samples').addEventListener('click', clearExamples);
  $('undo').addEventListener('click', undoDelete);
  $('refresh').addEventListener('click', function () { retried = false; refresh(true); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && view === 'app') { render(); if (pending === 0) refresh(false); }
  });
  setInterval(function () { if (!document.hidden && view === 'app' && pending === 0) refresh(false); }, POLL_MS);

  /* ---------- start ---------- */
  try { var f = localStorage.getItem(FILTER_KEY); if (f === 'all' || f === 'open' || f === 'overdue') filter = f; } catch (e) {}
  els.due.value = iso(addDays(new Date(), 7));
  els.today.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  if (!sb) {
    showBoot('Could not load the page', 'The Supabase library did not load. Check your connection and reload.');
    return;
  }
  start();
})();
</script>
</body>
</html>
